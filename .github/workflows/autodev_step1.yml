name: Autonomous Development Step 1

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Kernel chooses next development target
        run: python tools/autodev_step1.py --state development/autodev_state.json --report autodev_step1.json
      - uses: actions/upload-artifact@v4
        with:
          name: autodev-step1
          path: autodev_step1.json
