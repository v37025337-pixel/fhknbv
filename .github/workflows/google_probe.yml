name: Probe Google Search transport

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Test Google adapter
        run: python -m unittest tests.test_google_search -v
      - name: Probe actual Google transport
        run: python tools/google_search_probe.py --report google_search_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: google-search-probe
          path: google_search_probe.json
