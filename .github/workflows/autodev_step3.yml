name: Autonomous Development Step 3

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Kernel tests its self-selected hypothesis
        run: python tools/autodev_step3.py --hypothesis development/autodev_step2.json --report autodev_step3.json
      - uses: actions/upload-artifact@v4
        with:
          name: autodev-step3
          path: autodev_step3.json
